services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: servicepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: servicepilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "servicepilot", "-d", "servicepilot"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment: &servicepilot_environment
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+asyncpg://servicepilot@db:5432/servicepilot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DEALERSHIP_API_KEYS: ${DEALERSHIP_API_KEYS:-}
      ENABLE_SMS_SIMULATION: ${ENABLE_SMS_SIMULATION:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-}
      AGENT_MAX_ATTEMPTS: ${AGENT_MAX_ATTEMPTS:-}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-}
      SMS_DELIVERY_MAX_ATTEMPTS: ${SMS_DELIVERY_MAX_ATTEMPTS:-}
      SMS_MESSAGES_PER_MINUTE: ${SMS_MESSAGES_PER_MINUTE:-}
      SMS_TRANSPORT: ${SMS_TRANSPORT:-simulation}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_NUMBER_ROUTES: ${TWILIO_NUMBER_ROUTES:-}
      SMS_PUBLIC_WEBHOOK_BASE_URL: ${SMS_PUBLIC_WEBHOOK_BASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  migrate:
    build: .
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+asyncpg://servicepilot@db:5432/servicepilot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    environment: *servicepilot_environment
    command: ["python", "-m", "servicepilot.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 155s
    healthcheck:
      test: ["CMD", "python", "-m", "servicepilot.worker", "--health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://servicepilot@db:5432/servicepilot_test
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
